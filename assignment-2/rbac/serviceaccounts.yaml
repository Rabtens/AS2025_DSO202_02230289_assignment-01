# §2.3 - one ServiceAccount per workload, instead of every Pod silently
# running as the namespace's "default" ServiceAccount.
#
# Two reasons it matters here:
#  1. Least privilege on the Kubernetes API. None of these three
#     applications ever calls the API server, so they are bound to NO Role
#     and their API token is not even mounted
#     (automountServiceAccountToken: false). A compromised backend container
#     finds no credential to use against the cluster.
#  2. Workload identity in the mesh. Istio issues each Pod an mTLS
#     certificate whose identity is its ServiceAccount:
#       spiffe://cluster.local/ns/dso202-assignment-02/sa/backend-sa
#     istio/security.yaml authorizes traffic by exactly these names, which
#     only works if each tier has its own ServiceAccount.
#     (Istio obtains that certificate with its own projected token volume,
#     so turning off the automounted token does not affect it.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-sa
  namespace: dso202-assignment-02
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: dso202-assignment-02
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: dso202-assignment-02
automountServiceAccountToken: false
