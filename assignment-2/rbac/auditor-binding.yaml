# Read-only access for an auditor/marker, using the BUILT-IN "view"
# ClusterRole rather than writing a new Role.
#
# This shows the ClusterRole + RoleBinding combination (§2.3.5): the
# ClusterRole defines a reusable set of permissions once, cluster-wide, and
# a RoleBinding grants it inside ONE namespace only. The auditor can read
# this namespace and nothing else. The built-in "view" role deliberately
# excludes Secrets, so the database password stays unreadable here too.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-tracker-auditors
  namespace: dso202-assignment-02
subjects:
  - kind: User
    name: auditor@cst.edu.bt
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole       # a ClusterRole ...
  name: view
  apiGroup: rbac.authorization.k8s.io
                          # ... bound by a RoleBinding = namespace-scoped grant
