# Human access for the development team (subject kind: Group).
#
# Users are not Kubernetes objects - the authenticator (client certificate
# O= field, OIDC groups claim, ...) asserts the group, and RBAC only
# authorizes it (§2.3.3). Binding to a Group rather than individual Users
# means onboarding a developer is an identity-provider change, not an
# RBAC change.
#
# What a developer can do in THIS namespace only:
#   * read everything needed to debug: Pods, logs, events, Services,
#     Endpoints, ConfigMaps, workloads, Ingresses, PVCs, Istio routing
#   * exec into Pods and port-forward (debugging)
#   * restart/scale/roll back workloads (patch deployments & statefulsets)
# What a developer can NOT do:
#   * read Secrets (the database password)      - no rule mentions secrets
#   * delete PVCs (the ledger's data)           - no delete verb on them
#   * change RBAC, quotas or the namespace       - not listed
#   * anything in any other namespace            - Role, not ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-tracker-developer
  namespace: dso202-assignment-02
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps",
                "persistentvolumeclaims", "events", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  # kubectl rollout restart / scale / set image are all PATCHes.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io", "security.istio.io"]
    resources: ["virtualservices", "destinationrules", "peerauthentications", "authorizationpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dso202.cst.edu.bt"]
    resources: ["taskbackups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-tracker-developers
  namespace: dso202-assignment-02
subjects:
  - kind: Group
    name: dso202-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: task-tracker-developer
  apiGroup: rbac.authorization.k8s.io
