# Unit I made this the one NodePort in the namespace. With an Ingress in
# front (§2.2.2), the frontend no longer needs its own port on every node:
# it becomes ClusterIP and the Ingress controller is the single entry point.
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: task-tracker
    tier: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
