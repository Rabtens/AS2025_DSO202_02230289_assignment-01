# §2.3 applied to §2.4: the operator gets exactly what its reconcile loop
# touches, in this namespace only (Role, not ClusterRole).
#
# Deliberately absent: any access to Secrets. The backup Job needs the DB
# password, but the operator only writes the Secret's NAME into the Job's
# Pod spec; the kubelet resolves it. So a compromised operator cannot read
# the password.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskbackup-operator
  namespace: dso202-assignment-02
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskbackup-operator
  namespace: dso202-assignment-02
rules:
  # the informer (list + watch) and reconcile (get)
  - apiGroups: ["dso202.cst.edu.bt"]
    resources: ["taskbackups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dso202.cst.edu.bt"]
    resources: ["taskbackups/status"]
    verbs: ["get", "patch", "update"]
  # blockOwnerDeletion: true in the CronJob's ownerReference requires
  # permission to set finalizers on the owner.
  - apiGroups: ["dso202.cst.edu.bt"]
    resources: ["taskbackups/finalizers"]
    verbs: ["update"]
  # server-side apply = PATCH (create-or-update)
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskbackup-operator
  namespace: dso202-assignment-02
subjects:
  - kind: ServiceAccount
    name: taskbackup-operator
    namespace: dso202-assignment-02
roleRef:
  kind: Role
  name: taskbackup-operator
  apiGroup: rbac.authorization.k8s.io
---
# Identity the backup Job Pods run as: no API permissions at all. It exists
# so the database's Istio AuthorizationPolicy can admit backups by name
# (istio/security.yaml) without admitting anything else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskbackup-runner
  namespace: dso202-assignment-02
automountServiceAccountToken: false
