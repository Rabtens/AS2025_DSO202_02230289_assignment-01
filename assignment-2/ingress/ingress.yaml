# §2.2 - one host, two Ingress objects, one controller.
#
#   https://tasktracker.local/            -> frontend-svc:8080   (static UI)
#   https://tasktracker.local/backend/... -> backend-svc:8080    (/backend stripped)
#
# Why TWO Ingress objects instead of the single object in the lecture example:
# nginx.ingress.kubernetes.io/rewrite-target applies to EVERY path of the
# Ingress it is set on. The backend path needs "/backend/api/tasks" rewritten
# to "/api/tasks"; the frontend path must NOT be rewritten, or /app.js and
# /config.js would all be rewritten to "/" and the UI would break. Splitting
# them keeps each rewrite scoped to the path it belongs to (and follows
# §2.2.6's "one Ingress per application/concern").
#
# The two istio-specific annotations make the NGINX controller cooperate with
# the mesh (istio/ and README §7):
#   service-upstream: "true"  - NGINX sends to the Service's ClusterIP instead
#                               of picking Pod IPs itself, so the controller's
#                               own istio-proxy sidecar does the load
#                               balancing, retries and mTLS.
#   upstream-vhost            - sets the Host header to the Service's FQDN,
#                               which is the name Istio's routing tables
#                               (VirtualService hosts) are keyed on.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-tracker-frontend
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/upstream-vhost: frontend-svc.dso202-assignment-02.svc.cluster.local
spec:
  ingressClassName: nginx          # not the deprecated kubernetes.io/ingress.class annotation
  tls:
    - hosts:
        - tasktracker.local
      secretName: tasktracker-tls  # created by ingress/generate-tls.sh
  rules:
    - host: tasktracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-tracker-backend
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Capture group 2 is everything after "/backend/", so
    #   /backend/api/tasks/4  ->  /api/tasks/4
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/upstream-vhost: backend-svc.dso202-assignment-02.svc.cluster.local
    # Protect the API from a single client flooding it (per client IP).
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tasktracker.local
      secretName: tasktracker-tls
  rules:
    - host: tasktracker.local
      http:
        paths:
          # ImplementationSpecific is the one justified exception to §2.2.6's
          # "prefer Prefix/Exact": a regex path with capture groups is an
          # NGINX-specific feature and cannot be expressed as Prefix.
          - path: /backend(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-svc
                port:
                  name: http
