apiVersion: v1
kind: ConfigMap
metadata:
  name: task-tracker-config
  namespace: dso202-assignment-02
data:
  # --- consumed by the backend ---
  # Unit II change: the backend no longer talks to a load-balanced Service
  # name. It addresses the database replica by its StatefulSet identity:
  #   <pod-name>.<headless-service>  ->  db-0.db-headless
  # This name is stable across Pod deletion/rescheduling (§2.1.5), which is
  # exactly what a client of a primary database needs.
  DB_HOST: "db-0.db-headless"
  DB_PORT: "5432"
  DB_NAME: "taskdb"
  APP_PORT: "8080"
  # The browser now reaches the API on the same origin through the Ingress
  # (https://tasktracker.local/backend/...), so no cross-origin request is
  # ever made. Restricting CORS to that origin instead of Unit I's "*".
  CORS_ORIGIN: "https://tasktracker.local"
  # --- consumed by the official postgres image (must match DB_NAME above) ---
  POSTGRES_DB: "taskdb"
  # --- consumed by the frontend entrypoint script ---
  # Same-origin path. In Assignment 1 a custom nginx.conf inside the frontend
  # Pod proxied /backend/* to backend-svc. In Assignment 2 that job moves to
  # the Ingress controller (ingress/ingress.yaml), which is where Layer 7
  # routing belongs, and the frontend runs its image's stock nginx.conf.
  BACKEND_URL: "/backend"
