# §2.5 - zero-trust inside the namespace.
#
# 1) PeerAuthentication STRICT: every sidecar in the namespace accepts ONLY
#    mutual-TLS connections. A Pod without a sidecar (or anything outside the
#    mesh) that tries to connect in plain text is refused.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: dso202-assignment-02
spec:
  mtls:
    mode: STRICT
---
# 2) Default deny. An AuthorizationPolicy with an empty spec matches every
#    workload in the namespace and allows nothing. Each tier below is then
#    opened up to exactly the callers it needs - identified by the
#    ServiceAccount inside their mTLS certificate, not by IP address.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: dso202-assignment-02
spec: {}
---
# frontend <- ingress controller only
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: frontend-allow-ingress
  namespace: dso202-assignment-02
spec:
  selector:
    matchLabels:
      tier: frontend
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/ingress-nginx/sa/ingress-nginx"]
      to:
        - operation:
            methods: ["GET", "HEAD"]
            ports: ["8080"]
---
# backend <- ingress controller only, and only the REST API surface
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: backend-allow-ingress
  namespace: dso202-assignment-02
spec:
  selector:
    matchLabels:
      tier: backend
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/ingress-nginx/sa/ingress-nginx"]
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
            paths: ["/api/tasks", "/api/tasks/*", "/api/status"]
            ports: ["8080"]
---
# database <- backend and the backup Jobs only. Postgres is TCP, so only
# L4 attributes (identity, port) can be matched - no methods or paths.
# The frontend, the ingress controller and anything else are refused
# even though they are inside the same namespace.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: db-allow-backend-and-backups
  namespace: dso202-assignment-02
spec:
  selector:
    matchLabels:
      tier: database
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/dso202-assignment-02/sa/backend-sa"
              - "cluster.local/ns/dso202-assignment-02/sa/taskbackup-runner"
      to:
        - operation:
            ports: ["5432"]
