# DEMO ONLY - apply, test, then re-apply istio/traffic.yaml to remove it.
#
# Replaces the backend VirtualService with one that injects faults, but ONLY
# for requests carrying the header "x-dso202-chaos". Normal users (no
# header) are unaffected, so the experiment can run against a live system.
#
#   x-dso202-chaos: delay  -> 3s extra latency  (per-try timeout 2s trips,
#                             total timeout 6s -> shows timeouts at work)
#   x-dso202-chaos: abort  -> the sidecar returns 503 itself, without the
#                             request ever reaching a backend Pod
#
# Note: faults are injected BEFORE retries are evaluated, and Istio does not
# retry an injected abort - so "abort" shows exactly what the client sees
# when the API fails, and "delay" shows the timeout budget.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend
  namespace: dso202-assignment-02
spec:
  hosts:
    - backend-svc.dso202-assignment-02.svc.cluster.local
  http:
    - name: chaos-delay
      match:
        - headers:
            x-dso202-chaos:
              exact: delay
      fault:
        delay:
          percentage:
            value: 100
          fixedDelay: 3s
      route:
        - destination:
            host: backend-svc.dso202-assignment-02.svc.cluster.local
            subset: v1
      timeout: 2s
    - name: chaos-abort
      match:
        - headers:
            x-dso202-chaos:
              exact: abort
      fault:
        abort:
          percentage:
            value: 100
          httpStatus: 503
      route:
        - destination:
            host: backend-svc.dso202-assignment-02.svc.cluster.local
            subset: v1
    - name: normal
      route:
        - destination:
            host: backend-svc.dso202-assignment-02.svc.cluster.local
            subset: v1
      timeout: 6s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure,refused-stream
