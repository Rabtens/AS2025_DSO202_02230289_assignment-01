# §2.5 - traffic management and resiliency for the HTTP tiers.
#
# These rules are enforced by the CALLER's sidecar. The caller here is the
# ingress-nginx controller's istio-proxy (ingress/controller-mesh-patch.yaml
# + the service-upstream annotation), so every browser request is subject to
# them.

# ---------------------------------------------------------------- backend
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend
  namespace: dso202-assignment-02
spec:
  host: backend-svc.dso202-assignment-02.svc.cluster.local
  trafficPolicy:
    # Istio's automatic mTLS already does this; stated so the intent is
    # visible next to the STRICT PeerAuthentication.
    tls:
      mode: ISTIO_MUTUAL
    # Circuit breaking: bound how much a slow backend can queue up.
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 2s
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 100
    # Passive health checking: a replica that returns 3 consecutive 5xx is
    # ejected from load balancing for 30s, while the other replica serves.
    # maxEjectionPercent 50 = never eject both of the 2 replicas.
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend
  namespace: dso202-assignment-02
spec:
  hosts:
    - backend-svc.dso202-assignment-02.svc.cluster.local
  http:
    # Reads are idempotent: retry on any 5xx, reset or connect failure.
    - name: reads
      match:
        - method:
            exact: GET
      route:
        - destination:
            host: backend-svc.dso202-assignment-02.svc.cluster.local
            subset: v1
      timeout: 6s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure,refused-stream
    # Writes are NOT idempotent: retrying a POST that returned 503 could
    # insert the task twice. Retry only when the request provably never
    # reached the application (connection refused / failed).
    - name: writes
      route:
        - destination:
            host: backend-svc.dso202-assignment-02.svc.cluster.local
            subset: v1
      timeout: 6s
      retries:
        attempts: 2
        perTryTimeout: 3s
        retryOn: connect-failure,refused-stream
---
# ---------------------------------------------------------------- frontend
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend
  namespace: dso202-assignment-02
spec:
  host: frontend-svc.dso202-assignment-02.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend
  namespace: dso202-assignment-02
spec:
  hosts:
    - frontend-svc.dso202-assignment-02.svc.cluster.local
  http:
    - route:
        - destination:
            host: frontend-svc.dso202-assignment-02.svc.cluster.local
      timeout: 5s
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure
