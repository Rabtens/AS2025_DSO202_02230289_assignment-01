# Same credentials as Assignment 1. base64 is an ENCODING, not encryption -
# see the Assignment 1 README. What Unit II adds is control over WHO can read
# this object: rbac/ grants no human role and no application ServiceAccount
# 'get' on secrets. Only the kubelet (to inject env vars into Pods that
# reference it) and cluster-admin can read it.
apiVersion: v1
kind: Secret
metadata:
  name: task-tracker-secret
  namespace: dso202-assignment-02
type: Opaque
data:
  DB_USER: dGFza3VzZXI=                # taskuser
  DB_PASSWORD: VGFza1BAc3MyMDI2        # TaskP@ss2026
  POSTGRES_USER: dGFza3VzZXI=          # taskuser
  POSTGRES_PASSWORD: VGFza1BAc3MyMDI2  # TaskP@ss2026
