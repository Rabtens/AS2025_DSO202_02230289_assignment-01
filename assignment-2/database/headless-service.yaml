# §2.1.5 - the headless Service that gives the StatefulSet its network identity.
#
# clusterIP: None means no load-balancing virtual IP is allocated. Instead,
# CoreDNS publishes one A record per ready Pod, and - because the StatefulSet
# names this Service in spec.serviceName - a stable per-Pod name:
#   db-0.db-headless.dso202-assignment-02.svc.cluster.local
# The backend's DB_HOST (configmap.yaml) is the short form, db-0.db-headless.
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
    tier: database
spec:
  clusterIP: None
  # Publish the DNS record only once Postgres passes its readiness probe, so
  # the backend never resolves an address that would refuse connections.
  publishNotReadyAddresses: false
  selector:
    app: task-tracker
    tier: database
  ports:
    # The "tcp-" prefix tells Istio (§2.5) this port carries raw TCP, not HTTP,
    # so the sidecar proxies it at Layer 4 and does not try to parse it.
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
