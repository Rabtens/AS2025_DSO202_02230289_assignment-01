# §2.1 - the database tier as a StatefulSet instead of Unit I's
# Deployment + hand-made PVC.
#
# Why replicas: 1 and not 3: a StatefulSet makes each replica's NAME, DNS
# address and VOLUME stable. It does not make Postgres replicate (§2.1.9,
# first pitfall). Three copies of this image would be three unrelated
# databases, each with its own seed data, and the backend would see a
# different ledger depending on which one it hit. Real Postgres replication
# needs primary/replica logic in the startup scripts - which is what a
# Postgres Operator (e.g. CloudNativePG) adds on top of a StatefulSet
# (§2.1.6, last point). One replica is the honest configuration for this image.
#
# What the StatefulSet still gives us over Assignment 1:
#   * a stable identity: the Pod is always db-0, reachable as db-0.db-headless
#   * volumeClaimTemplates: the PVC (data-db-0) is generated and owned per
#     ordinal, and re-attached to db-0 after every restart or reschedule
#   * an explicit PVC retention policy instead of an implicit default
#   * partitioned rolling updates for a canary-style change (README §4.4)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
    tier: database
spec:
  serviceName: db-headless          # must be the headless Service above
  replicas: 1
  podManagementPolicy: OrderedReady # db-N+1 waits for db-N to be Ready
  revisionHistoryLimit: 5           # ControllerRevisions kept for rollout undo
  selector:
    matchLabels:
      app: task-tracker
      tier: database
  template:
    metadata:
      labels:
        app: task-tracker
        tier: database
        version: v1
    spec:
      serviceAccountName: db-sa     # rbac/serviceaccounts.yaml - no API access
      terminationGracePeriodSeconds: 30  # time for Postgres to checkpoint on SIGTERM
      containers:
        - name: db
          image: sarojsanyasi/dso202-db:1.0
          ports:
            - name: tcp-postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: POSTGRES_PASSWORD
            # Keep the cluster files in a subdirectory of the mount, so a
            # lost+found (or any other file the storage backend creates at
            # the volume root) can never make initdb refuse to run.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Readiness gates the DNS record (publishNotReadyAddresses: false)
          # and therefore the backend's ability to connect at all.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # §2.1.5 - one PVC per ordinal, named <template>-<pod>: data-db-0.
  # The kind cluster's default StorageClass "standard" uses
  # volumeBindingMode: WaitForFirstConsumer, so the volume is only provisioned
  # after db-0 has been scheduled, on the node db-0 landed on.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: task-tracker
          tier: database
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # 0 = every ordinal receives a template change. Raised temporarily to
      # hold a change back during the canary procedure in README §4.4, then
      # lowered back to 0 (§2.1.9, last pitfall).
      partition: 0
  # §2.1.6 - stated explicitly rather than left to the default. Deleting the
  # StatefulSet or scaling it down must never silently destroy the ledger.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
