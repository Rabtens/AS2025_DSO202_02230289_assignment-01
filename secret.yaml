# NOTE (documented per Task 2 requirement):
# The values below are base64-ENCODED, not encrypted. Kubernetes Secrets are
# only obfuscated at rest by default (no encryption-at-rest is enabled on
# this kind cluster) -- base64 is an encoding for safe transport in YAML/JSON,
# not a security control. Anyone with `kubectl get secret -o yaml` access or
# etcd access can trivially decode these. This is called out here rather than
# "fixed", because enabling encryption-at-rest / KMS providers is out of the
# Unit I scope for this assignment.
apiVersion: v1
kind: Secret
metadata:
  name: task-tracker-secret
  namespace: dso202-assignment-01
type: Opaque
data:
  # --- consumed by the backend ---
  DB_USER: dGFza3VzZXI=          # taskuser
  DB_PASSWORD: VGFza1BAc3MyMDI2  # TaskP@ss2026
  # --- consumed by the official postgres image (must equal DB_USER/DB_PASSWORD above) ---
  POSTGRES_USER: dGFza3VzZXI=          # taskuser
  POSTGRES_PASSWORD: VGFza1BAc3MyMDI2  # TaskP@ss2026
